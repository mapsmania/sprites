<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drunk Map</title>
  <link href="https://unpkg.com/maplibre-gl@3.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@3.4.0/dist/maplibre-gl.js"></script>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [13.333, 47.516],
      zoom: 6
    });

    map.on('load', () => {
      const labelLayers = ['label_city', 'label_city_capital', 'label_country_1', 'label_town'];
      const boundaryLayers = ['boundary_1', 'boundary_2', 'boundary_3'];
      const fillLayers = ['park'];

      const instantConfig = { duration: 0 };

      // Safely remove transitions for existing layers
      [...labelLayers, ...boundaryLayers, ...fillLayers].forEach(id => {
        const layer = map.getLayer(id);
        if (!layer) return; // skip missing layers

        switch(layer.type) {
          case 'symbol':
            map.setPaintProperty(id, 'text-translate-transition', instantConfig);
            map.setPaintProperty(id, 'icon-translate-transition', instantConfig);
            break;
          case 'line':
            map.setPaintProperty(id, 'line-translate-transition', instantConfig);
            break;
          case 'fill':
            map.setPaintProperty(id, 'fill-translate-transition', instantConfig);
            break;
          case 'circle':
            map.setPaintProperty(id, 'circle-translate-transition', instantConfig);
            break;
          // Add other layer types if needed
        }
      });

      function animate(time) {
        const t = time / 1000; // seconds

        // --- Labels: move + color pulse ---
        const xOffsetLabel = Math.sin(t) * 20;
        const yOffsetLabel = Math.cos(t * 0.8) * 15;
        labelLayers.forEach(id => {
          const layer = map.getLayer(id);
          if (!layer) return;

          // Movement
          map.setPaintProperty(id, 'text-translate', [xOffsetLabel, yOffsetLabel]);

          // Color pulse (HSL cycling)
          const hue = (t * 60) % 360;
          const saturation = 80;
          const lightness = 50 + Math.sin(t * 2) * 10;
          map.setPaintProperty(id, 'text-color', `hsl(${hue}, ${saturation}%, ${lightness}%)`);
        });

        // --- Boundaries: subtle shimmer ---
        const bx = Math.sin(t + 0.5) * 10;
        boundaryLayers.forEach(id => {
          const layer = map.getLayer(id);
          if (!layer) return;

          map.setPaintProperty(id, 'line-translate', [bx, 0]);
          const hue = (t * 20) % 360;
          map.setPaintProperty(id, 'line-color', `hsl(${hue}, 60%, 40%)`);
        });

        // --- Fills: slow drift + color change ---
        const fx = Math.sin(t * 0.5) * 25;
        fillLayers.forEach(id => {
          const layer = map.getLayer(id);
          if (!layer) return;

          map.setPaintProperty(id, 'fill-translate', [fx, 5]);
          const hue = (t * 10) % 360;
          map.setPaintProperty(id, 'fill-color', `hsl(${hue}, 50%, 60%)`);
        });

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
