<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenFreeMap + Moving Sprites</title>

  <!-- MapLibre GL CSS -->
  <link
    href="https://unpkg.com/maplibre-gl@3.4.0/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <!-- Sprite CSS -->
  <link rel="stylesheet" crossorigin href="https://mapsmania.github.io/sprites/index-BPbBbLQu.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div> <!-- required by the sprite library -->
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@3.4.0/dist/maplibre-gl.js"></script>

  <script type="module">
    // Load the sprite library dynamically
    const module = await import('https://mapsmania.github.io/sprites/index-e61LCIjh.js');
    const { createSpriteLayer, initializeRuntimeHost } = module;

    // Initialize MapLibre map
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [13.388, 52.517],
      zoom: 9.5
    });

    map.on('load', async () => {
      // Initialize SpriteLayer runtime (WASM)
      await initializeRuntimeHost({
        wasmBaseUrl: 'https://mapsmania.github.io/sprites/wasm/'
      });

      // Create and add a SpriteLayer
      const spriteLayer = createSpriteLayer({ id: 'city-labels' });
      map.addLayer(spriteLayer);

      // Add some moving city labels (same as before)
    });
  </script>
</body>
</html>
