<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenFreeMap + Moving Sprites</title>

  <!-- MapLibre GL CSS -->
  <link
    href="https://unpkg.com/maplibre-gl@3.4.0/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <!-- Sprite CSS -->
  <link rel="stylesheet" crossorigin href="https://mapsmania.github.io/sprites/index-BPbBbLQu.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.4.0/dist/maplibre-gl.js"></script>

  <!-- Sprite Module Loader -->
  <script type="module">
    // Load the GitHub module dynamically and attach exports to window
    const module = await import('https://mapsmania.github.io/sprites/index-e61LCIjh.js');
    window.createSpriteLayer = module.createSpriteLayer;
    window.initializeRuntimeHost = module.initializeRuntimeHost;

    // Initialize MapLibre map
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [13.388, 52.517],
      zoom: 9.5
    });

    map.on('load', async () => {
      console.log('Map loaded successfully!');

      // Initialize SpriteLayer runtime (WASM)
      await window.initializeRuntimeHost({
        wasmBaseUrl: 'https://mapsmania.github.io/sprites/wasm/' // adjust if needed
      });

      // Create a SpriteLayer
      const spriteLayer = window.createSpriteLayer({ id: 'city-labels' });
      map.addLayer(spriteLayer);

      // Example cities
      const cities = [
        { id: 'berlin', name: 'Berlin', lng: 13.388, lat: 52.517 },
        { id: 'potsdam', name: 'Potsdam', lng: 13.066, lat: 52.398 },
        { id: 'or-another', name: 'Another City', lng: 13.5, lat: 52.5 }
      ];

      // Register text sprites
      for (const city of cities) {
        await spriteLayer.registerTextGlyph(
          city.id,
          city.name,
          { maxWidthPixel: 128 },
          { color: '#ff0000', backgroundColor: 'rgba(255,255,255,0.6)', paddingPixel: { top: 2, right: 4, bottom: 2, left: 4 } }
        );

        spriteLayer.addSprite(city.id, {
          location: { lng: city.lng, lat: city.lat },
          images: [
            { subLayer: 0, order: 0, imageId: city.id, mode: 'billboard' }
          ]
        });
      }

      // Move Berlin randomly every second
      setInterval(() => {
        spriteLayer.updateSprite('berlin', {
          location: {
            lng: 13.388 + (Math.random() - 0.5) * 0.02,
            lat: 52.517 + (Math.random() - 0.5) * 0.02
          },
          interpolation: { durationMs: 1000, mode: 'feedforward' }
        });
      }, 1000);
    });
  </script>
</body>
</html>
